name: CI

on:
  push:
    branches-ignore: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Cache build artifacts
        uses: actions/cache@v4
        with:
          path: |
            cache
            out
          key: build-${{ runner.os }}-${{ hashFiles('yarn.lock', 'foundry.toml', 'contracts/**') }}

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Forge build
        run: forge build

      - name: Forge test
        run: forge test -vvv

      - name: Validate exported ABIs
        run: |
          yarn export-abis
          git diff --exit-code abis/ || {
            echo "::error::ABIs are stale. Run 'yarn export-abis' and commit."
            exit 1
          }

      - name: TypeScript strict check
        run: yarn lint

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Run coverage (libraries)
        run: >-
          FOUNDRY_PROFILE=coverage forge coverage
          --report lcov --report summary
          --ir-minimum
          --skip "RiskMath.t"
          | tee /tmp/coverage-summary.txt

      - name: Coverage summary
        if: always()
        run: |
          if [ ! -f lcov.info ]; then
            echo "### Coverage report not found" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "### Forge Coverage (libraries)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -E "^(\||File)" /tmp/coverage-summary.txt >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
