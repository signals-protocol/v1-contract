name: CI

on:
  push:
    branches-ignore: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Cache Hardhat artifacts
        uses: actions/cache@v4
        with:
          path: |
            cache
            artifacts
            typechain-types
          key: hardhat-${{ runner.os }}-${{ hashFiles('yarn.lock', 'hardhat.config.ts', 'hardhat.config.js', 'contracts/**') }}

      - name: Compile contracts
        run: yarn hardhat compile

      - name: Generate typechain types
        run: npx hardhat typechain

      - name: TypeScript strict check
        run: yarn lint

      - name: Run tests
        run: yarn test

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run coverage
        run: yarn test:cov

      - name: Coverage summary
        if: always()
        run: |
          if [ ! -f coverage/coverage-summary.json ]; then
            echo "### Coverage report not found" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          node -e "
          const cs = require('./coverage/coverage-summary.json').total;
          const fmt = (m) => m.pct + '%';
          const lines = [
            '### Solidity Coverage',
            '',
            '| Metric | Coverage |',
            '|--------|----------|',
            '| Statements | ' + fmt(cs.statements) + ' |',
            '| Branches | ' + fmt(cs.branches) + ' |',
            '| Functions | ' + fmt(cs.functions) + ' |',
            '| Lines | ' + fmt(cs.lines) + ' |',
          ];
          console.log(lines.join('\n'));
          " >> "$GITHUB_STEP_SUMMARY"
