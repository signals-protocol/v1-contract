[profile.default]
src = "contracts"
out = "out"
libs = ["lib", "node_modules"]
test = "test"
cache_path = "cache/foundry"
remappings = [
    "forge-std/=lib/forge-std/src/",
    "openzeppelin-foundry-upgrades/=lib/openzeppelin-foundry-upgrades/src/",
    "@openzeppelin/=node_modules/@openzeppelin/",
    "@prb/=node_modules/@prb/",
    "@redstone-finance/=node_modules/@redstone-finance/"
]
auto_detect_remappings = false

ffi = true
ast = true
build_info = true
extra_output = ["storageLayout"]

bytecode_hash = "none"
offline = false
solc_version = "0.8.28"
via_ir = true
optimizer = true
optimizer_runs = 200

script = "script"

fs_permissions = [
    { access = "read-write", path = "scripts/environments/" },
    { access = "read-write", path = "releases/" },
    { access = "read-write", path = "script-output/" },
    { access = "read", path = "broadcast/" },
    { access = "read", path = "script/config/" },
    { access = "read", path = "out/" },
]

[rpc_endpoints]
dev = "${DEV_RPC_URL}"
prod = "${PROD_RPC_URL}"
local = "http://127.0.0.1:8545"
