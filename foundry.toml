[profile.default]
src = "contracts"
out = "out"
libs = ["lib", "node_modules"]
test = "test"
cache_path = "cache/foundry"
remappings = [
    "@openzeppelin/=node_modules/@openzeppelin/",
    "@prb/=node_modules/@prb/"
]

bytecode_hash = "none"
offline = false
solc_version = "0.8.28"
via_ir = true
optimizer = true
optimizer_runs = 200
